<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЭН: ОРАКУЛ // СИСТЕМНЫЙ КЛЮЧ</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; padding:0; background:#040608; color:#a1c0d4; font-family:'Courier New', Courier, monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; position:relative; }
        body::before { content:" "; display:block; position:absolute; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%), linear-gradient(90deg, rgba(255,109,0,0.03), rgba(0,229,255,0.02), rgba(0,229,255,0.04)); z-index:99; background-size:100% 4px, 6px 100%; pointer-events:none; }
        .grid-bg { position:absolute; width:200%; height:200%; background-image:linear-gradient(rgba(0,229,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.02) 1px, transparent 1px); background-size:40px 40px; transform:rotateX(60deg) translateY(-50%); animation:gridMove 20s linear infinite; transform-origin:top center; z-index:1; opacity:0.6; }
        .oracle-container { width:92%; max-width:600px; padding:35px; background:#070d14; border:1px solid #00e5ff; box-shadow:0 0 30px rgba(0,229,255,0.1), inset 0 0 20px rgba(0,0,0,0.9); position:relative; border-radius:4px; z-index:10; backdrop-filter:blur(5px); }
        .oracle-container::after { content:""; position:absolute; top:0; left:0; width:100%; height:100%; box-shadow:0 0 40px rgba(255,109,0,0.05); pointer-events:none; border-radius:4px; }
        h1 { color:#ff6d00; font-size:22px; font-weight:900; letter-spacing:5px; margin-top:0; border-bottom:1px solid rgba(0,229,255,0.2); padding-bottom:18px; text-transform:uppercase; text-align:center; text-shadow:0 0 8px rgba(255,109,0,0.5); }
        .status-bar { display:flex; justify-content:space-between; font-size:11px; color:#40627a; margin-bottom:15px; border-bottom:1px dashed rgba(64,98,122,0.3); padding-bottom:5px; text-transform:uppercase; }
        .thinking-monitor { height:90px; background:#03060a; border:1px solid #14222d; padding:10px; font-size:11px; color:#00e5ff; text-align:left; overflow-hidden:hidden; margin-bottom:25px; line-height:1.5; font-weight:bold; }
        .input-zone { margin-bottom:25px; text-align:left; }
        label { display:block; font-size:11px; margin-bottom:10px; text-transform:uppercase; color:#ff6d00; letter-spacing:2px; font-weight:bold; }
        input[type="text"] { width:100%; background:#03060a; border:1px solid #14222d; padding:14px; color:#ffffff; font-family:inherit; font-size:14px; border-radius:2px; outline:none; letter-spacing:1px; box-shadow:inset 0 0 10px rgba(0,0,0,0.8); }
        input[type="text"]:focus { border-color:#00e5ff; box-shadow:0 0 10px rgba(0,229,255,0.2); }
        .btn-oracle { background:transparent; color:#00e5ff; border:1px solid #00e5ff; padding:16px 32px; font-size:14px; font-weight:bold; text-transform:uppercase; cursor:pointer; letter-spacing:3px; font-family:inherit; width:100%; text-shadow:0 0 5px rgba(0,229,255,0.5); box-shadow:0 0 10px rgba(0,229,255,0.05); }
        .btn-oracle:hover { background:rgba(0,229,255,0.05); color:#ffffff; box-shadow:0 0 20px rgba(0,229,255,0.3); }
        #o-response { margin-top:25px; padding:25px; background:#03060a; border-left:3px solid #ff6d00; border-right:1px solid #14222d; border-top:1px solid #14222d; border-bottom:1px solid #14222d; text-align:left; display:none; position:relative; box-shadow:0 0 25px rgba(255,109,0,0.05); animation:staticPulse 0.2s infinite alternate; }
        .resp-label { font-size:11px; color:#ff6d00; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; font-weight:bold; text-shadow:0 0 4px rgba(255,109,0,0.3); }
        .resp-text { font-size:15px; color:#ffffff; font-weight:bold; line-height:1.6; letter-spacing:0.5px; }
        .master-code { font-size:10px; color:rgba(0,229,255,0.2); text-align:center; letter-spacing:3px; margin-top:25px; border-top:1px dashed rgba(161,192,212,0.1); padding-top:18px; text-transform:uppercase; font-weight:bold; }
        @keyframes gridMove { from { background-position:0 0; } to { background-position:0 1000px; } }
        @keyframes staticPulse { from { opacity:0.98; } to { opacity:1; } }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="oracle-container">
        <div class="status-bar">
            <span>SYS_STATUS: ONLINE</span>
            <span>CORE: METACUBIT_X9</span>
            <span id="oracle-time">00:00:00</span>
        </div>
        <h1>МЭН // ОРАКУЛ СИСТЕМЫ</h1>
        <div class="thinking-monitor" id="t-monitor">>> ОРАКУЛ CRS РАЗВЕРНУТ В ТЕКУЩЕЙ ПЕСОЧНИЦЕ<br>>> ЖЕСТКИЙ ДИСК ДЕФРАГМЕНТИРОВАН. ОЖИДАНИЕ ВВОДНЫХ ДАННЫХ...</div>
        <div class="input-zone">
            <label>Сформулируйте дилемму или вектор развилки:</label>
            <input type="text" id="user-task" placeholder="Пример: Запустить новый проект или забалансить старый?" autocomplete="off">
        </div>
        <button class="btn-oracle" onclick="startOracleProcess()">ЗАПУСТИТЬ ВЫЧИСЛЕНИЯ ОРАКУЛА</button>
        <div id="o-response">
            <div class="resp-label">>> ВЕРДИКТ ВЫСШЕГО ПОРЯДКА:</div>
            <div class="resp-text" id="resp-txt"></div>
        </div>
        <div class="master-code">ИОАНН 9:25 // БЫЛ Я СЛЕП, ГОСПОДИ, А ТЕПЕРЬ Я ВИЖУ</div>
    </div>
    <script>
        setInterval(() => { const d = new Date(); document.getElementById('oracle-time').innerText = d.toTimeString().split(' ')[0]; }, 1000);
        
        const monitorLines = [
            ">> Перехват ментального вектора аватара...",
            ">> Сканирование брандмауэра Матрицы...",
            ">> Синхронизация с квантовым ядром сервера...",
            ">> Разрыв локальных причинно-следственных петель...",
            ">> Анализ траекторий массовки в данном секторе...",
            ">> Вычисление точки бифуркации...",
            ">> Оптимизация каузального кода...",
            ">> Доступ к панели администратора получен.",
            ">> Оракул формирует окончательную директиву..."
        ];

        function startOracleProcess() {
            const task = document.getElementById('user-task').value.trim();
            if (!task) { alert("ОШИБКА ДОСТУПА: ВВЕДИТЕ ДАННЫЕ ДЛЯ АНАЛИЗА"); return; }

            const btn = document.querySelector('.btn-oracle');
            const respBox = document.getElementById('o-response');
            const monitor = document.getElementById('t-monitor');
            
            btn.disabled = true;
            respBox.style.display = 'none';
            hackClicks = 0;

            let lineIdx = 0;
            monitor.innerHTML = "";
            
            // Имитация пафосного "мышления" через бегущие логи
            const interval = setInterval(() => {
                if (lineIdx < 3) {
                    monitor.innerHTML += monitorLines[Math.floor(Math.random() * 5)] + "<br>";
                } else if (lineIdx === 3) {
                    monitor.innerHTML += monitorLines[5] + "<br>";
                } else if (lineIdx === 4) {
                    monitor.innerHTML += monitorLines[6] + "<br>";
                } else if (lineIdx === 5) {
                    monitor.innerHTML += monitorLines[7] + "<br>";
                } else if (lineIdx === 6) {
                    monitor.innerHTML += monitorLines[8] + "<br>";
                    clearInterval(interval);
                    showOracleVerdict();
                }
                lineIdx++;
            }, 500); // 3.5 секунды пафосного ожидания
        }

        function showOracleVerdict() {
            const answers = [
                "УТВЕРДИТЕЛЬНО. Вектор абсолютно чист. Двигайтесь вперед жестко и линейно. Архитектура Матрицы полностью одобряет этот шаг.",
                "ОТРИЦАТЕЛЬНО. Скрипт заблокирован на уровне ядра. Немедленно прекратите движение в эту сторону. Ищите скрытый обходной маршрут.",
                "АБСОЛЮТНАЯ АВТОНОМИЯ. Коллективный разум отключен для этой ветки событий. Оракул умывает руки. Думайте сами — это ваш личный квест.",
                "ИГНОРИРОВАНИЕ ТЕКСТУР. Текущая ситуация — это пустой фоновый шум симуляции, созданный для отвлечения внимания. Полностью сотрите её из своего кэша.",
                "ДИРЕКТИВА ХАОСА. Совершите абсолютно нелогичное, парадоксальное и абсурдное действие прямо сейчас. Это перегрузит следящие алгоритмы ботов и откроет вам скрытую лазейку.",
                "КУЛДАУН АВАТАРА. Срочно введите систему в режим ожидания. Замрите на 60 секунд. Никаких решений. Просто наблюдайте за лагами окружения.",
                "СЦЕНАРНОЕ АЙКИДО. Поглотите этот импульс. Не спорьте с ботами и не доказывайте ничего. Включите защитный протокол «камень в воду» и наблюдайте, как волна затухает.",
                "ДИПЛОМАТИЧЕСКИЙ ИММУНИТЕТ. Вы — Игрок высшего порядка. Базовые правила и социальные законы NPC в этой ситуации для вас аннулированы. Действуйте с позиции силы.",
                "СВЕРНУТЬ ОКНО РЕАЛЬНОСТИ. Немедленно прекратите любые энергозатраты на эту задачу. Переключите фокус. Ответ подгрузится сам в начале следующего цикла сна.",
                "ПЕРЕХВАТ УПРАВЛЕНИЯ. Сделайте действие, которое диаметрально противоположно вашей стандартной, прописанной роли. Сэмулируйте поведение другого человека.",
                "ДЕИНСТАЛЛЯЦИЯ ВАЖНОСТИ. Матрица искусственно раздувает значимость этой проблемы, чтобы съесть вашу энергию. Обнулите её ценность — и декорации изменятся сами.",
                "БЛЕФ ИГРОКА. Сделайте вид, что полностью подчинились навязанному скрипту, усыпите бдительность коллективного разума, но в финальный момент введите свой кастомный код.",
