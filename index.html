<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЭН: ОРАКУЛ-ШУТЕР</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; padding:0; background:#040608; color:#a1c0d4; font-family:'Courier New', Courier, monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; position:relative; }
        body::before { content:" "; display:block; position:absolute; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%), linear-gradient(90deg, rgba(255,109,0,0.03), rgba(0,229,255,0.02), rgba(0,229,255,0.04)); z-index:99; background-size:100% 4px, 6px 100%; pointer-events:none; }
        .oracle-container { width:95%; max-width:650px; padding:25px; background:#070d14; border:1px solid #00e5ff; box-shadow:0 0 30px rgba(0,229,255,0.1); text-align:center; position:relative; z-index:10; border-radius:4px; }
        h1 { color:#ff6d00; font-size:20px; font-weight:900; letter-spacing:4px; margin:0 0 15px 0; text-transform:uppercase; text-shadow:0 0 8px rgba(255,109,0,0.5); }
        .status-bar { display:flex; justify-content:space-between; font-size:11px; color:#40627a; margin-bottom:15px; border-bottom:1px dashed rgba(64,98,122,0.3); padding-bottom:5px; }
        .input-zone { margin-bottom:15px; text-align:left; }
        label { display:block; font-size:11px; margin-bottom:8px; text-transform:uppercase; color:#ff6d00; letter-spacing:1px; font-weight:bold; }
        input[type="text"] { width:100%; background:#03060a; border:1px solid #14222d; padding:12px; color:#ffffff; font-family:inherit; font-size:14px; border-radius:2px; outline:none; }
        input[type="text"]:focus { border-color:#00e5ff; }
        .btn-oracle { background:transparent; color:#00e5ff; border:1px solid #00e5ff; padding:14px 28px; font-size:13px; font-weight:bold; text-transform:uppercase; cursor:pointer; letter-spacing:2px; font-family:inherit; width:100%; }
        .btn-oracle:hover { background:rgba(0,229,255,0.05); color:#ffffff; box-shadow:0 0 15px rgba(0,229,255,0.2); }
        canvas { border: 1px solid #14222d; background: #020406; display: none; margin: 15px auto; cursor: crosshair; max-width: 100%; }
        #o-response { margin-top:15px; padding:20px; background:#03060a; border-left:3px solid #ff6d00; border-top:1px solid #14222d; border-bottom:1px solid #14222d; border-right:1px solid #14222d; text-align:left; display:none; box-shadow:0 0 25px rgba(255,109,0,0.05); }
        .resp-label { font-size:11px; color:#ff6d00; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; font-weight:bold; }
        .resp-text { font-size:14px; color:#ffffff; font-weight:bold; line-height:1.6; }
        .master-code { font-size:10px; color:rgba(0,229,255,0.2); text-align:center; letter-spacing:3px; margin-top:20px; border-top:1px dashed rgba(161,192,212,0.1); padding-top:15px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="oracle-container">
        <div class="status-bar">
            <span>SYS: RECREATION_SERVICES</span>
            <span id="target-count">БЛОКИ: 0/5</span>
            <span id="oracle-time">00:00:00</span>
        </div>
        <h1>МЭН // ОРАКУЛ-ШУТЕР</h1>
        
        <div class="input-zone" id="setup-stage">
            <label>Сформулируйте развилку для взлома:</label>
            <input type="text" id="user-task" placeholder="Пример: Запустить новый вектор проекта?" autocomplete="off">
            <button class="btn-oracle" style="margin-top: 15px;" onclick="initLaserHack()">НАЧАТЬ ПРОБИВКУ БРАНДМАУЭРА</button>
        </div>

        <canvas id="shooterCanvas" width="580" height="250"></canvas>

        <div id="o-response">
            <div class="resp-label">>> ВЕРДИКТ ВЫСШЕГО ПОРЯДКА:</div>
            <div class="resp-text" id="resp-txt"></div>
            <button class="btn-oracle" style="margin-top: 20px; padding: 8px 16px; font-size: 11px;" onclick="resetToStart()">НОВЫЙ ЗАПРОС</button>
        </div>
        <div class="master-code">ИОАНН 9:25 // БЫЛ Я СЛЕП, ГОСПОДИ, А ТЕПЕРЬ Я ВИЖУ</div>
    </div>

    <script>
        setInterval(() => { const d = new Date(); document.getElementById('oracle-time').innerText = d.toTimeString().split(' '); }, 1000);

        const canvas = document.getElementById("shooterCanvas");
        const ctx = canvas.getContext("2d");
        
        let player = { x: 290, y: 220, size: 20, color: "#00e5ff" };
        let bullets = [];
        let targets = [];
        let hits = 0;
        let maxHits = 5;
        let isPlaying = false;
        let animationFrameId;

        // Отслеживание мыши/тача на холсте
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = (e.clientX - rect.left) * (canvas.width / rect.width) - player.size / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
        });

        canvas.addEventListener("click", () => {
            if (!isPlaying) return;
            bullets.push({ x: player.x + player.size / 2 - 2, y: player.y, size: 4, speed: 7, color: "#ff6d00" });
        });

        // Тач-управление для телефонов
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            player.x = (touch.clientX - rect.left) * (canvas.width / rect.width) - player.size / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
        });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (!isPlaying) return;
            bullets.push({ x: player.x + player.size / 2 - 2, y: player.y, size: 4, speed: 7, color: "#ff6d00" });
        });

        function initLaserHack() {
            const task = document.getElementById('user-task').value.trim();
            if (!task) { alert("ОШИБКА: ОПИШИТЕ ВАШУ СИТУАЦИЮ ДЛЯ СИНХРОНИЗАЦИИ"); return; }
            
            document.getElementById('setup-stage').style.display = 'none';
            document.getElementById('o-response').style.display = 'none';
            canvas.style.display = 'block';
            
            hits = 0;
            bullets = [];
            targets = [];
            document.getElementById('target-count').innerText = `БЛОКИ: 0/${maxHits}`;
            isPlaying = true;
            
            spawnTarget();
            gameLoop();
        }

        function spawnTarget() {
            if (!isPlaying) return;
            targets.push({
                x: Math.random() * (canvas.width - 20),
                y: -20,
                size: 16,
                speed: 1.5 + Math.random() * 2,
                color: "#ff3333"
            });
            if (isPlaying && targets.length < 3) {
                setTimeout(spawnTarget, 1000);
            }
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка игрока
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Логика пуль
            bullets.forEach((b, bIdx) => {
                b.y -= b.speed;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.size, b.size);
                if (b.y < 0) bullets.splice(bIdx, 1);
            });

            // Логика целей
            targets.forEach((t, tIdx) => {
                t.y += t.speed;
                ctx.fillStyle = t.color;
                ctx.fillRect(t.x, t.y, t.size, t.size);

                // Если цель упала — спавним заново сверху
                if (t.y > canvas.height) {
                    targets.splice(tIdx, 1);
                    spawnTarget();
                }

                // Проверка попаданий
                bullets.forEach((b, bIdx) => {
                    if (b.x < t.x + t.size && b.x + b.size > t.x && b.y < t.y + t.size && b.y + b.size > t.y) {
                        bullets.splice(bIdx, 1);
                        targets.splice(tIdx, 1);
                        hits++;
                        document.getElementById('target-count').innerText = `БЛОКИ: ${hits}/${maxHits}`;
                        
                        if (hits >= maxHits) {
                            endGameAndShowVerdict();
                        } else {
                            spawnTarget();
                        }
                    }
                });
            });

            if (isPlaying) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function endGameAndShowVerdict() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            canvas.style.display = 'none';
            document.getElementById('o-response').style.display = 'block';

            const answers = [
                "УТВЕРДИТЕЛЬНО. Вектор абсолютно чист. Двигайтесь вперед жестко и линейно. Архитектура Матрицы полностью одобряет этот шаг.",
                "ОТРИЦАТЕЛЬНО. Скрипт заблокирован на уровне ядра. Немедленно прекратите движение в эту сторону. Ищите скрытый обходной маршрут.",
                "АБСОЛЮТНАЯ АВТОНОМИЯ. Коллективный разум отключен для этой ветки событий. Оракул умывает руки. Думайте сами — это ваш личный квест.",
                "ИГНОРИРОВАНИЕ ТЕКСТУР. Текущая ситуация — это пустой фоновый шум симуляции, созданный для отвлечения внимания. Полностью сотрите её из своего кэша.",
